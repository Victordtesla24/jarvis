<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JARVIS V3 — Target HUD Side-by-Side Comparator</title>
<link rel="icon" href="data:image/png;base64,iVBORw0KGgo=">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --cy: #1AE6F5;
    --cy-dim: rgba(26, 230, 245, 0.45);
    --cy-soft: rgba(26, 230, 245, 0.15);
    --bg: #050810;
    --bg-pane: #000;
    --amber: #FFC800;
    --amber-dim: rgba(255, 200, 0, 0.55);
  }
  html, body {
    width: 100vw; height: 100vh;
    background: var(--bg);
    color: var(--cy);
    font-family: 'Share Tech Mono', 'Menlo', monospace;
    overflow: hidden;
    user-select: none;
  }
  /* ── LAYOUT: bar (top), 2 columns (mid), bar (bottom) ───────────── */
  body {
    display: grid;
    grid-template-rows: 44px 1fr 76px;
    grid-template-columns: 1fr;
  }
  .topbar, .botbar {
    background: rgba(8, 14, 26, 0.92);
    border-bottom: 1px solid var(--cy-dim);
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 14px;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .botbar {
    border-top: 1px solid var(--cy-dim);
    border-bottom: none;
    flex-wrap: wrap;
    padding: 8px 14px;
  }
  .panes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
    background: var(--cy-dim);
    overflow: hidden;
  }
  .pane {
    position: relative;
    background: var(--bg-pane);
    overflow: hidden;
  }
  .pane .label {
    position: absolute;
    top: 8px; left: 10px;
    background: rgba(8, 14, 26, 0.78);
    color: var(--cy);
    padding: 3px 9px;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    border-left: 2px solid var(--cy);
    z-index: 50;
    pointer-events: none;
  }
  .pane.target .label { border-left-color: var(--amber); color: var(--amber); }
  .pane .label .sublabel {
    display: block;
    font-size: 9px;
    color: rgba(255, 255, 255, 0.55);
    letter-spacing: 0.10em;
    margin-top: 2px;
  }
  .pane .frame {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-origin: center center;
    transition: transform 250ms ease;
  }
  .pane.zoomed .frame {
    transform: scale(2.4);
  }
  .pane iframe {
    width: 100%; height: 100%;
    border: 0;
    background: var(--bg-pane);
  }
  .pane img.ref {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  /* ── TOPBAR ─────────────────────────────────────────────────────── */
  .topbar h1 {
    font-size: 12px;
    font-weight: 600;
    color: var(--cy);
    letter-spacing: 0.24em;
    text-shadow: 0 0 12px rgba(26, 230, 245, 0.55);
  }
  .topbar .tag {
    color: rgba(255, 255, 255, 0.55);
    font-size: 10px;
  }
  .topbar .spacer { flex: 1; }
  .topbar button, .botbar button {
    appearance: none;
    background: rgba(26, 230, 245, 0.05);
    color: var(--cy);
    border: 1px solid var(--cy-dim);
    padding: 5px 12px;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-family: inherit;
    cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease;
  }
  .topbar button:hover, .botbar button:hover {
    background: rgba(26, 230, 245, 0.18);
    border-color: var(--cy);
  }
  .topbar button.active, .botbar button.active {
    background: rgba(26, 230, 245, 0.25);
    color: #FFFFFF;
    border-color: var(--cy);
  }
  /* ── BOTBAR — reference picker chips ─────────────────────────────── */
  .botbar .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(8, 14, 26, 0.55);
    border: 1px solid rgba(255, 200, 0, 0.30);
    padding: 5px 10px;
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255, 200, 0, 0.75);
    cursor: pointer;
    transition: border-color 120ms ease, color 120ms ease, background 120ms ease;
  }
  .botbar .chip:hover {
    border-color: var(--amber);
    color: var(--amber);
    background: rgba(28, 18, 4, 0.75);
  }
  .botbar .chip.active {
    background: rgba(48, 28, 4, 0.95);
    border-color: var(--amber);
    color: var(--amber);
    box-shadow: 0 0 10px rgba(255, 200, 0, 0.32);
  }
  .botbar .chip .num {
    font-weight: 700;
    font-size: 10px;
    color: rgba(255, 200, 0, 0.85);
  }
  /* Crosshair guides for visual alignment */
  .pane::before, .pane::after {
    content: '';
    position: absolute;
    background: rgba(26, 230, 245, 0.12);
    pointer-events: none;
    z-index: 5;
  }
  .pane::before { left: 50%; top: 0; bottom: 0; width: 1px; }
  .pane::after  { top: 50%; left: 0; right: 0; height: 1px; }
  /* Annotation hint */
  .hint {
    position: absolute;
    bottom: 10px; right: 10px;
    background: rgba(8, 14, 26, 0.78);
    padding: 4px 8px;
    font-size: 9px;
    letter-spacing: 0.12em;
    color: rgba(255, 255, 255, 0.50);
    z-index: 50;
    pointer-events: none;
    max-width: 260px;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="topbar">
    <h1>JARVIS V3 · TARGET COMPARATOR</h1>
    <span class="tag" id="cycleStatus">cycle: auto · 4s</span>
    <span class="spacer"></span>
    <span class="tag" style="color: rgba(26,230,245,0.55);">LEFT:</span>
    <button class="srcBtn active" data-src="jarvis-cinematic-combined.html">COMBINED · V3+VECTEEZY</button>
    <button class="srcBtn" data-src="jarvis-vecteezy-baseline.html">VECTEEZY · WHITE</button>
    <button class="srcBtn" data-src="jarvis-uhd-cinematic-v2.html">V3 DASHBOARD</button>
    <button class="srcBtn" data-src="jarvis-reactor-c-shape-baseline.html">C-SHAPE BASELINE</button>
    <button class="srcBtn" id="marvelChip" data-src="jarvis-reactor-cinematic-marvel.html">MARVEL V4</button>
    <span class="spacer" style="flex: 0.3"></span>
    <button id="autoBtn" class="active">⏵ AUTO-CYCLE</button>
    <button id="zoomBtn">🔍 REACTOR ZOOM</button>
    <button id="reloadBtn">↻ RELOAD V3</button>
  </div>

  <div class="panes">
    <div class="pane v3" id="paneV3">
      <div class="label">
        V3 · LIVE
        <span class="sublabel" id="v3Sublabel">prototypes/jarvis-cinematic-combined.html</span>
      </div>
      <div class="frame" id="v3Frame">
        <iframe id="v3Iframe" src="jarvis-cinematic-combined.html?compare=1"></iframe>
      </div>
      <div class="hint">centre crosshair for visual alignment · use LEFT chips above to switch source</div>
    </div>
    <div class="pane target" id="paneTarget">
      <div class="label">
        TARGET · <span id="refLabel">…</span>
        <span class="sublabel" id="refSub">…</span>
      </div>
      <div class="frame" id="refFrame">
        <!-- Either <img id="refImg"> OR <iframe id="refIframe"> is shown — set by JS. -->
        <img class="ref" id="refImg" src="refs/vecteezy-1-white-hud-circle.jpg" alt="target reference">
        <iframe id="refIframe" style="display:none"></iframe>
      </div>
      <div class="hint" id="refHint">Vecteezy 1 · white precision dial — THE ONLY TARGET</div>
    </div>
  </div>

  <div class="botbar" id="picker">
    <span class="tag" style="color: rgba(255,200,0,0.55); margin-right: 4px;">REFS:</span>
    <!-- chips populated by JS -->
  </div>

<script>
// ════ Reference catalog ════
// SINGLE TARGET MODE — only Vecteezy 1 (white precision dial). All other refs
// removed per user direction: "remove all target images only keep one - VECTEEZY 1".
const REFS = [
  {
    id: 'vecteezy-1',
    label: 'Vecteezy 1 · white HUD',
    sublabel: 'tick-scale precision dial — THE ONLY TARGET',
    src: 'refs/vecteezy-1-white-hud-circle.jpg',
    hint: 'Vecteezy 1625732 — WHITE rings on PURE BLACK. Two dense outer tick-scale arc bands (top + bottom), ▲▼◀▶ cardinal triangle markers pointing INWARD, 4 large gray C-shape mid-arcs with cardinal gaps, 2 inner thin concentric rings, 3 tiny dot markers, "0.41" and "0.06" numerical readouts at left/right. The exact design we are matching.',
  },
  {
    id: 'c-shape-baseline',
    label: 'C-Shape Baseline · live',
    sublabel: 'NEW · jarvis-reactor-c-shape-baseline.html',
    iframeUrl: 'jarvis-reactor-c-shape-baseline.html',
    hint: 'NEW C-shape concentric reactor baseline (R-1 / R-2 / R-3). 4 single-gap C-rings with staggered gap centres ≥30° and alternating CW/CCW rotation, BPM-synced non-linear easing, bloom layer. Chip swaps the comparator pane to the live baseline.',
  },
];

// ════ State ════
const state = {
  refIdx: 0,
  auto: true,
  zoom: false,
  cycleMs: 4000,
};
let cycleTimer = null;

// ════ Picker chips ════
const picker = document.getElementById('picker');
REFS.forEach((r, i) => {
  const chip = document.createElement('button');
  chip.className = 'chip';
  chip.dataset.idx = String(i);
  chip.innerHTML = '<span class="num">' + String(i + 1).padStart(2, '0') + '</span> ' + r.label;
  chip.addEventListener('click', () => {
    state.auto = false;
    autoBtn.classList.remove('active');
    autoBtn.textContent = '⏵ AUTO-CYCLE';
    showRef(i);
    updateCycleStatus();
  });
  picker.appendChild(chip);
});

// ════ Display logic ════
const refImg = document.getElementById('refImg');
const refIframe = document.getElementById('refIframe');
const refLabel = document.getElementById('refLabel');
const refSub = document.getElementById('refSub');
const refHint = document.getElementById('refHint');
const cycleStatus = document.getElementById('cycleStatus');
const v3Pane = document.getElementById('paneV3');
const targetPane = document.getElementById('paneTarget');
const v3Iframe = document.getElementById('v3Iframe');
const v3Sublabel = document.getElementById('v3Sublabel');
const autoBtn = document.getElementById('autoBtn');
const zoomBtn = document.getElementById('zoomBtn');
const reloadBtn = document.getElementById('reloadBtn');

function showRef(idx) {
  state.refIdx = idx;
  const r = REFS[idx];
  // Switch between <img> and <iframe> based on the ref kind.
  if (r.iframeUrl) {
    refImg.style.display = 'none';
    refIframe.style.display = 'block';
    refIframe.style.width = '100%';
    refIframe.style.height = '100%';
    refIframe.style.border = '0';
    refIframe.style.background = '#000';
    refIframe.src = r.iframeUrl + '?compare=1&t=' + Date.now();
  } else {
    refIframe.style.display = 'none';
    refIframe.src = 'about:blank';
    refImg.style.display = 'block';
    refImg.src = r.src;
  }
  refLabel.textContent = r.label;
  refSub.textContent = r.sublabel;
  refHint.textContent = r.hint;
  // Highlight active chip
  for (const chip of picker.querySelectorAll('.chip')) {
    chip.classList.toggle('active', Number(chip.dataset.idx) === idx);
  }
}

function updateCycleStatus() {
  cycleStatus.textContent = state.auto
    ? 'cycle: auto · ' + (state.cycleMs / 1000) + 's'
    : 'cycle: paused (manual)';
}

function startCycle() {
  if (cycleTimer) clearInterval(cycleTimer);
  cycleTimer = setInterval(() => {
    if (!state.auto) return;
    showRef((state.refIdx + 1) % REFS.length);
  }, state.cycleMs);
}

// ════ Controls ════
autoBtn.addEventListener('click', () => {
  state.auto = !state.auto;
  autoBtn.classList.toggle('active', state.auto);
  autoBtn.textContent = state.auto ? '⏸ PAUSE CYCLE' : '⏵ AUTO-CYCLE';
  updateCycleStatus();
});

zoomBtn.addEventListener('click', () => {
  state.zoom = !state.zoom;
  zoomBtn.classList.toggle('active', state.zoom);
  zoomBtn.textContent = state.zoom ? '🔍 RESTORE' : '🔍 REACTOR ZOOM';
  v3Pane.classList.toggle('zoomed', state.zoom);
  targetPane.classList.toggle('zoomed', state.zoom);
});

// V3 LEFT pane source selector — combined V3+Vecteezy is the default; other
// prototypes available via the LEFT chip bar for direct comparison.
let v3CurrentSrc = 'jarvis-cinematic-combined.html';
const srcLabels = {
  'jarvis-cinematic-combined.html':        'prototypes/jarvis-cinematic-combined.html',
  'jarvis-vecteezy-baseline.html':         'prototypes/jarvis-vecteezy-baseline.html',
  'jarvis-uhd-cinematic-v2.html':          'prototypes/jarvis-uhd-cinematic-v2.html',
  'jarvis-reactor-c-shape-baseline.html':  'prototypes/jarvis-reactor-c-shape-baseline.html',
  'jarvis-reactor-cinematic-marvel.html':  'prototypes/jarvis-reactor-cinematic-marvel.html',
};
function setV3Source(src) {
  v3CurrentSrc = src;
  v3Iframe.src = src + '?compare=1&t=' + Date.now();
  v3Sublabel.textContent = srcLabels[src] || src;
  for (const b of document.querySelectorAll('.srcBtn')) {
    b.classList.toggle('active', b.dataset.src === src);
  }
}
for (const b of document.querySelectorAll('.srcBtn')) {
  b.addEventListener('click', () => setV3Source(b.dataset.src));
}

reloadBtn.addEventListener('click', () => {
  v3Iframe.src = v3CurrentSrc + '?compare=1&t=' + Date.now();
});

// Auto-reload LEFT pane every 30s in case of source changes (keeps the comparison
// fresh during iterative development without requiring a manual reload click).
setInterval(() => {
  v3Iframe.src = v3CurrentSrc + '?compare=1&t=' + Date.now();
}, 30000);

// ════ Boot ════
showRef(0);
updateCycleStatus();
startCycle();
</script>
</body>
</html>
