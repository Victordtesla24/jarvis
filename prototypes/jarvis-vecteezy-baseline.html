<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JARVIS — Vecteezy 1 Baseline (Marvel-Grade Cinematic)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  :root {
    --bg:           #000000;     /* pure deep black per Vecteezy 1 */
    --tick-bright:  #FFFFFF;     /* full white — major ticks */
    --tick-dim:     #C8CDD2;     /* slightly dim — minor ticks */
    --tri-white:    #F0F2F4;     /* solid triangle markers */
    --c-arc-fill:   rgba(190, 195, 200, 0.34); /* the gray C-arc fill */
    --c-arc-edge:   rgba(220, 225, 230, 0.22); /* C-arc subtle edge */
    --thin-ring:    rgba(220, 225, 230, 0.78); /* inner double rings */
    --inner-dot:    #F4F6F8;     /* small dot markers */
    --readout:      rgba(220, 225, 230, 0.86); /* "0.41" / "0.06" */
    /* Marvel-grade cinematic enhancements (additive only — silhouette preserved) */
    --bloom-tone:   rgba(245, 250, 255, 1);    /* near-white halo bias */
    --flare-tone:   rgba(220, 245, 255, 0.85); /* anamorphic streak tint */
  }
  html, body {
    width: 100vw; height: 100vh;
    background: var(--bg);
    overflow: hidden;
    color: var(--tick-bright);
    font-family: 'Share Tech Mono', 'Menlo', monospace;
    -webkit-font-smoothing: antialiased;
  }
  /* Boot opacity fade-in (cinematic entry, 1.2s ease-out) — avoids the
     instant-pop you get with a hard page-load reveal. */
  body { opacity: 0; transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1); }
  body.booted { opacity: 1; }

  canvas {
    position: fixed; top: 0; left: 0;
    width: 100vw; height: 100vh;
  }
  #bgCanvas      { z-index: 0; }
  #mainCanvas    { z-index: 1; }
  /* Scanner sweep — Iron-Man-style thin radial line with trailing wedge,
     painted SHARP (no blur). Composited via screen blend so it adds light. */
  #scannerCanvas { z-index: 2; mix-blend-mode: screen; pointer-events: none; }
  /* Bloom canvas — soft Gaussian-equivalent halo on bright elements (the
     ticks, triangles, readouts, and C-arc edges). Stays NEAR-WHITE so the
     silhouette of the precision dial reads identically to the reference. */
  #bloomCanvas   { z-index: 3; filter: blur(9px); opacity: 0.55; mix-blend-mode: screen; }
  /* Wider secondary halo — soft cinematic glow envelope around the whole
     reactor zone. Heavy blur + low opacity ⇒ silhouette unchanged. */
  #bloom2Canvas  { z-index: 3; filter: blur(36px); opacity: 0.30; mix-blend-mode: screen; }
  /* Anamorphic horizontal lens-flare streak — thin band across centre,
     very low opacity, only visible as a subtle cinema-sheen. */
  #flareCanvas   { z-index: 4; mix-blend-mode: screen; opacity: 0.55; pointer-events: none; }
  /* Chromatic-aberration aux layer (RGB-shift the brightest pixels by
     1px). Adds cinematic-camera feel without breaking sharpness. */
  #chromaCanvas  { z-index: 5; mix-blend-mode: screen; opacity: 0.18; pointer-events: none; }
  /* Subtle grain — barely visible, just enough to avoid a pristine look. */
  #grainCanvas   { z-index: 9; mix-blend-mode: overlay; opacity: 0.022; pointer-events: none; }

  /* Cinematic vignette — heavy filmic falloff (CSS, no canvas overhead) */
  #vignette {
    position: fixed; inset: 0;
    z-index: 8;
    pointer-events: none;
    background:
      radial-gradient(ellipse at center,
        transparent 42%,
        rgba(0,0,0,0.18) 62%,
        rgba(0,0,0,0.55) 88%,
        rgba(0,0,0,0.85) 100%);
  }
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<canvas id="mainCanvas"></canvas>
<canvas id="scannerCanvas"></canvas>
<canvas id="bloomCanvas"></canvas>
<canvas id="bloom2Canvas"></canvas>
<canvas id="flareCanvas"></canvas>
<canvas id="chromaCanvas"></canvas>
<div id="vignette"></div>
<canvas id="grainCanvas"></canvas>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// JARVIS Vecteezy 1 Baseline — exact rebuild of "White HUD Circle UI"
// Reference: prototypes/refs/vecteezy-1-white-hud-circle.jpg
//            (https://www.vecteezy.com/video/1625732-white-hud-circle-user-interface)
// ═══════════════════════════════════════════════════════════════════════════
// Layered composition (back → front):
//   1. Pure black background
//   2. Outer dense tick scale — 2 arc bands (top + bottom), with side gaps
//   3. Cardinal ▲▼◀▶ solid white triangles (4, pointing inward)
//   4. C-shape mid-ring — 4 gray solid arc segments with cardinal gaps
//   5. Inner double thin ring — 2 concentric thin white circles
//   6. 3 tiny white dot markers on the inner thin rings
//   7. Numerical readouts "0.41" (left) and "0.06" (right)
// ═══════════════════════════════════════════════════════════════════════════

const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const DPR = Math.min(window.devicePixelRatio || 1, 3);

const c_bg      = document.getElementById('bgCanvas').getContext('2d');
const c_main    = document.getElementById('mainCanvas').getContext('2d');
const c_scanner = document.getElementById('scannerCanvas').getContext('2d');
const c_bloom   = document.getElementById('bloomCanvas').getContext('2d');
const c_bloom2  = document.getElementById('bloom2Canvas').getContext('2d');
const c_flare   = document.getElementById('flareCanvas').getContext('2d');
const c_chroma  = document.getElementById('chromaCanvas').getContext('2d');
const c_grain   = document.getElementById('grainCanvas').getContext('2d');
const canvases = {
  bg:      document.getElementById('bgCanvas'),
  main:    document.getElementById('mainCanvas'),
  scanner: document.getElementById('scannerCanvas'),
  bloom:   document.getElementById('bloomCanvas'),
  bloom2:  document.getElementById('bloom2Canvas'),
  flare:   document.getElementById('flareCanvas'),
  chroma:  document.getElementById('chromaCanvas'),
  grain:   document.getElementById('grainCanvas'),
};

let W, H, CX, CY, R;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  CX = W / 2;
  CY = H / 2;
  R = Math.min(W, H) * 0.36;
  for (const k of Object.keys(canvases)) {
    const c = canvases[k];
    c.width = W * DPR;
    c.height = H * DPR;
    c.style.width = W + 'px';
    c.style.height = H + 'px';
    c.getContext('2d').setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  paintBlackBg();
}
window.addEventListener('resize', resize);

function paintBlackBg() {
  c_bg.fillStyle = '#000000';
  c_bg.fillRect(0, 0, W, H);
}

// ═══ Smooth additive-sin easing (no jagged motion, per spec) ═══
function inertia(t, omega, opts) {
  const o = opts || {};
  const a = o.amp != null ? o.amp : 0.10;
  const b = o.freq != null ? o.freq : 0.22;
  return omega * t + a * Math.sin(b * t + (o.offset || 0));
}

// ═══════════════════════════════════════════════════════════════════════════
// MARVEL-GRADE BOOT CHOREOGRAPHY (Iter 2)
// ═══════════════════════════════════════════════════════════════════════════
// Staggered reveal of each precision-dial layer over the first ~2 s after
// page load. Each layer's draw function multiplies its alpha (or progressively
// extends its arc end-angle) by the corresponding `bootEase()` value.
//
// Stage timeline (seconds from rAF start):
//   0.00 → 0.85   outer tick scale          (reveal sweeps from band-start to band-end)
//   0.50 → 1.20   C-shape mid-ring          (each of 4 arcs grows from midpoint outward)
//   0.95 → 1.55   inner double thin rings   (clockwise sweep from 12 o'clock)
//   1.30 → 1.80   cardinal triangles        (scale + fade in)
//   1.55 → 1.95   numerical readouts        (fade in + tiny slide)
//   2.00 →  ∞     NOMINAL — boot complete; everything at full alpha
// ═══════════════════════════════════════════════════════════════════════════
const BOOT_STAGES = {
  ticks:     { start: 0.00, end: 0.85 },
  cArcs:     { start: 0.50, end: 1.20 },
  innerRings:{ start: 0.95, end: 1.55 },
  triangles: { start: 1.30, end: 1.80 },
  readouts:  { start: 1.55, end: 1.95 },
};
const BOOT_DUR = 2.00;
function bootProgress(t, stage) {
  const s = BOOT_STAGES[stage];
  if (t <= s.start) return 0;
  if (t >= s.end)   return 1;
  const p = (t - s.start) / (s.end - s.start);
  return 1 - Math.pow(1 - p, 3);   // easeOutCubic
}
function isBooted(t) { return t >= BOOT_DUR; }

// ═══ OUTER DENSE TICK SCALE — two arc bands (top + bottom, gaps at sides) ═══
// Reference: Vecteezy 1 has TWO dense tick-scale arc bands centered on TOP and
// BOTTOM, with vertical gaps at LEFT and RIGHT where the "0.41" / "0.06"
// numerical readouts sit.
// Canvas-Y-down convention:  0°=right, 90°=bottom, 180°=left, 270°=top.
//   TOP    band: centred at 270°, span ±70° → 200° → 340°
//   BOTTOM band: centred at  90°, span ±70° →  20° → 160°
//   LEFT   gap:  160° → 200°  (40° wide — for "0.41" readout + ◀ triangle)
//   RIGHT  gap:  340° →  20°  (40° wide — for "0.06" readout + ▶ triangle)
// Each band ~120 dense ticks; long every 5th, short between.
// Slow CW rotation matches reference motion.
function drawOuterTickScale(t) {
  const ringR = R * 0.96;
  const tickShort = R * 0.022;
  const tickLong  = R * 0.048;
  const rot = inertia(t, 0.018, { amp: 0.05, freq: 0.16 });
  const boot = bootProgress(t, 'ticks');     // 0 → 1 over first 0.85 s

  // Tighter side gaps (~25° each) match the reference more closely than 40°.
  const bands = [
    { startDeg: 192, endDeg: 348 },   // TOP band — 156° span centred at 270°
    { startDeg:  12, endDeg: 168 },   // BOTTOM band — 156° span centred at 90°
  ];

  for (const band of bands) {
    const span = band.endDeg - band.startDeg;
    const tickCount = Math.round(125 * span / 156);
    const stepDeg = span / tickCount;
    // Boot reveal: ticks fade in left-to-right within each band based on `boot`
    const visibleCount = Math.ceil(tickCount * boot);
    for (let i = 0; i <= visibleCount; i++) {
      const deg = band.startDeg + i * stepDeg;
      const a = deg * DEG + rot;
      const isLong = (i % 5) === 0;
      const inner = ringR;
      const outer = ringR + (isLong ? tickLong : tickShort);
      // Per-tick fade-in for the leading edge — gives a smooth reveal sweep
      const tickFade = Math.min(1, (boot * tickCount - i + 1) / 3);
      c_main.strokeStyle = isLong
        ? 'rgba(255, 255, 255, ' + (0.95 * tickFade).toFixed(3) + ')'
        : 'rgba(220, 225, 230, ' + (0.65 * tickFade).toFixed(3) + ')';
      c_main.lineWidth = isLong ? 1.3 : 0.7;
      c_main.beginPath();
      c_main.moveTo(CX + Math.cos(a) * inner, CY + Math.sin(a) * inner);
      c_main.lineTo(CX + Math.cos(a) * outer, CY + Math.sin(a) * outer);
      c_main.stroke();
    }
  }

  // Thin inner guide arc — also reveals progressively (arc end-angle scales with boot)
  c_main.strokeStyle = 'rgba(255, 255, 255, ' + (0.55 * boot).toFixed(3) + ')';
  c_main.lineWidth = 1.2;
  for (const band of bands) {
    const a0 = band.startDeg * DEG + rot;
    const a1 = a0 + (band.endDeg - band.startDeg) * DEG * boot;
    c_main.beginPath();
    c_main.arc(CX, CY, ringR, a0, a1);
    c_main.stroke();
  }
}

// ═══ CARDINAL ▲ ▼ TRIANGLE MARKERS — 2 solid white inward triangles ═══
// Vecteezy 1 has only TOP (▲) and BOTTOM (▼) prominent cardinal triangles.
// Both point INWARD toward centre. The LEFT/RIGHT positions instead host the
// "0.41" and "0.06" numerical readouts (no triangles there in the reference).
function drawCardinalTriangles(t) {
  const boot = bootProgress(t, 'triangles');     // scale + fade in over 1.30→1.80 s
  if (boot <= 0) return;
  const tipR  = R * 0.78;
  const baseR = R * 0.85;
  const halfBase = R * 0.026;
  const pulse = 0.92 + 0.08 * Math.sin(t * 0.7);
  for (const deg of [90, 270]) {     // bottom (▼) and top (▲) only
    const a = deg * DEG;
    // Boot scale-in: triangle starts collapsed at its midpoint, expands to full size
    const midR = (tipR + baseR) * 0.5;
    const tipR_anim  = midR + (tipR  - midR) * boot;
    const baseR_anim = midR + (baseR - midR) * boot;
    const half_anim  = halfBase * boot;
    const tipX = CX + Math.cos(a) * tipR_anim;
    const tipY = CY + Math.sin(a) * tipR_anim;
    const perpA = a + Math.PI / 2;
    const baseLX = CX + Math.cos(a) * baseR_anim + Math.cos(perpA) * half_anim;
    const baseLY = CY + Math.sin(a) * baseR_anim + Math.sin(perpA) * half_anim;
    const baseRX = CX + Math.cos(a) * baseR_anim - Math.cos(perpA) * half_anim;
    const baseRY = CY + Math.sin(a) * baseR_anim - Math.sin(perpA) * half_anim;
    c_main.fillStyle = 'rgba(240, 242, 244, ' + (0.95 * pulse * boot).toFixed(3) + ')';
    c_main.beginPath();
    c_main.moveTo(tipX, tipY);
    c_main.lineTo(baseLX, baseLY);
    c_main.lineTo(baseRX, baseRY);
    c_main.closePath();
    c_main.fill();
  }
}

// ═══ C-SHAPE MID-RING — 4 large gray-white solid arcs with cardinal gaps ═══
// Vecteezy 1 shows 4 large solid arcs forming a "broken ring" with gaps at
// the 4 cardinal positions. Each arc spans ~70°. The arcs are filled wide
// stroke (NOT thin lines) — they read as solid translucent bands.
// Slow CW rotation gives the reference's subtle drift feel.
function drawCShapeMidRing(t) {
  const boot = bootProgress(t, 'cArcs');     // 0 → 1 over 0.50→1.20 s
  if (boot <= 0) return;
  const ringR = R * 0.55;
  const ringW = R * 0.110;        // wide stroke so it reads as a solid band
  const arcSpanDeg = 70;          // each arc spans 70°
  const rot = inertia(t, 0.014, { amp: 0.04, freq: 0.18 });
  // Centres of the 4 arc midpoints (at the 4 quadrants between cardinals)
  const arcMidpoints = [45, 135, 225, 315];   // canvas-Y-down degrees
  for (const midDeg of arcMidpoints) {
    // Boot reveal: each arc grows from its MIDPOINT outward to full span
    const halfSpan = (arcSpanDeg / 2) * boot;
    const startDeg = midDeg - halfSpan;
    const endDeg   = midDeg + halfSpan;
    const a0 = startDeg * DEG + rot;
    const a1 = endDeg   * DEG + rot;
    // Wide gray fill — alpha scales with boot to fade in the gray slab
    c_main.strokeStyle = 'rgba(190, 195, 200, ' + (0.34 * boot).toFixed(3) + ')';
    c_main.lineWidth = ringW;
    c_main.beginPath();
    c_main.arc(CX, CY, ringR, a0, a1);
    c_main.stroke();
    // Crisp thin edge highlights on inner + outer rim of the arc band
    c_main.strokeStyle = 'rgba(255, 255, 255, ' + (0.65 * boot).toFixed(3) + ')';
    c_main.lineWidth = 0.9;
    c_main.beginPath();
    c_main.arc(CX, CY, ringR + ringW * 0.5, a0, a1);
    c_main.stroke();
    c_main.beginPath();
    c_main.arc(CX, CY, ringR - ringW * 0.5, a0, a1);
    c_main.stroke();
  }
}

// ═══ INNER DOUBLE THIN RING + 3 TINY WHITE DOTS ═══
// Two concentric thin white circles forming a small inner zone. The reference
// also has 3 tiny dot markers on the inner thin rings (top, bottom-right, near-center).
function drawInnerThinRings(t) {
  const boot = bootProgress(t, 'innerRings');      // 0 → 1 over 0.95→1.55 s
  if (boot <= 0) return;
  const r1 = R * 0.30;            // outer of the two thin rings
  const r2 = R * 0.21;            // inner of the two thin rings
  // Boot reveal: clockwise sweep from -π/2 (12 o'clock) up to full circle as boot → 1
  const sweepStart = -Math.PI / 2;
  const sweepEnd   = sweepStart + TAU * boot;
  // Outer thin ring
  c_main.strokeStyle = 'rgba(220, 225, 230, 0.86)';
  c_main.lineWidth = 1.0;
  c_main.beginPath(); c_main.arc(CX, CY, r1, sweepStart, sweepEnd); c_main.stroke();
  // Inner thin ring
  c_main.strokeStyle = 'rgba(220, 225, 230, 0.72)';
  c_main.lineWidth = 0.8;
  c_main.beginPath(); c_main.arc(CX, CY, r2, sweepStart, sweepEnd); c_main.stroke();

  // 3 tiny dot markers — only appear once their host ring is fully revealed.
  // Slow rotation around centre so they feel "active" but never strobe.
  const slowRot = inertia(t, -0.04, { amp: 0.05, freq: 0.20 });
  const dots = [
    { rFrac: 0.30, baseDeg: 270 },      // dot near top of outer thin ring
    { rFrac: 0.30, baseDeg:  60 },      // dot near bottom-right of outer thin ring
    { rFrac: 0.21, baseDeg: 100 },      // dot near bottom of inner thin ring
  ];
  for (const d of dots) {
    const a = d.baseDeg * DEG + slowRot;
    // Reveal a dot only when the sweep has reached its angular position
    const localA = ((d.baseDeg * DEG - sweepStart) % TAU + TAU) % TAU;
    if (localA > TAU * boot) continue;
    const dx = CX + Math.cos(a) * R * d.rFrac;
    const dy = CY + Math.sin(a) * R * d.rFrac;
    c_main.fillStyle = 'rgba(244, 246, 248, 0.95)';
    c_main.beginPath();
    c_main.arc(dx, dy, R * 0.0070, 0, TAU);
    c_main.fill();
  }
}

// ═══ NUMERICAL READOUTS — "0.41" (left) and "0.06" (right) ═══
// Vecteezy 1 places these precision labels INSIDE the LEFT and RIGHT vertical
// gaps in the tick scale, between the C-arc outer edge and the tick band.
function drawReadouts(t) {
  const boot = bootProgress(t, 'readouts');     // fade-in + tiny slide over 1.55→1.95 s
  if (boot <= 0) return;
  c_main.save();
  c_main.fillStyle = 'rgba(225, 228, 232, ' + (0.92 * boot).toFixed(3) + ')';
  c_main.font = '500 ' + (R * 0.043).toFixed(0) + 'px "Share Tech Mono", monospace';
  c_main.textBaseline = 'middle';

  // LEFT readout — slides in slightly from outside (R*0.83 → R*0.80)
  const lr = R * (0.80 + (1 - boot) * 0.03);
  const lx = CX + Math.cos(180 * DEG) * lr;
  const ly = CY + Math.sin(180 * DEG) * lr;
  c_main.textAlign = 'center';
  c_main.fillText('0.41', lx, ly);

  // RIGHT readout — slides in symmetrically
  const rr = R * (0.80 + (1 - boot) * 0.03);
  const rx = CX + Math.cos(0) * rr;
  const ry = CY + Math.sin(0) * rr;
  c_main.textAlign = 'center';
  c_main.fillText('0.06', rx, ry);
  c_main.restore();
}

// ═══ FILM GRAIN — minimal texture ═══
function drawGrain() {
  const w = canvases.grain.width;
  const h = canvases.grain.height;
  const img = c_grain.createImageData(w, h);
  const data = img.data;
  for (let i = 0; i < data.length; i += 16) {
    const v = Math.random() * 255;
    data[i] = v; data[i + 1] = v; data[i + 2] = v; data[i + 3] = 22;
  }
  c_grain.putImageData(img, 0, 0);
}

// ═══════════════════════════════════════════════════════════════════════════
// MARVEL-GRADE CINEMATIC POST-PROCESSING (additive only — silhouette preserved)
// ═══════════════════════════════════════════════════════════════════════════
// Each emitter below paints WIDER + LOWER-ALPHA variants of the corresponding
// main-canvas element onto the bloom / bloom2 / flare / chroma layers. The
// CSS filter blur(9px) + blur(36px) + screen-blend then composites the result
// as soft cinematic glow without altering the precision-dial silhouette.

// Bloom emit for the outer dense tick scale — every 5th (long) tick gets a
// near-white bloom stroke. Gated on the same boot stage as the ticks themselves.
function emitBloomTickScale(t) {
  const boot = bootProgress(t, 'ticks');
  if (boot <= 0) return;
  const ringR = R * 0.96;
  const tickLong  = R * 0.048;
  const rot = inertia(t, 0.018, { amp: 0.05, freq: 0.16 });
  const bands = [
    { startDeg: 192, endDeg: 348 },
    { startDeg:  12, endDeg: 168 },
  ];
  for (const band of bands) {
    const span = band.endDeg - band.startDeg;
    const tickCount = Math.round(125 * span / 156);
    const stepDeg = span / tickCount;
    const visibleCount = Math.ceil(tickCount * boot);
    for (let i = 0; i <= visibleCount; i++) {
      const deg = band.startDeg + i * stepDeg;
      const a = deg * DEG + rot;
      const isLong = (i % 5) === 0;
      if (!isLong) continue;
      const inner = ringR;
      const outer = ringR + tickLong;
      c_bloom.strokeStyle = 'rgba(245, 250, 255, 0.85)';
      c_bloom.lineWidth = 2.4;
      c_bloom.beginPath();
      c_bloom.moveTo(CX + Math.cos(a) * inner, CY + Math.sin(a) * inner);
      c_bloom.lineTo(CX + Math.cos(a) * outer, CY + Math.sin(a) * outer);
      c_bloom.stroke();
    }
  }
  // Soft bloom2 envelope around the whole tick-scale annulus — also reveals progressively
  c_bloom2.strokeStyle = 'rgba(220, 240, 255, ' + (0.45 * boot).toFixed(3) + ')';
  c_bloom2.lineWidth = R * 0.026;
  for (const band of bands) {
    const a0 = band.startDeg * DEG + rot;
    const a1 = a0 + (band.endDeg - band.startDeg) * DEG * boot;
    c_bloom2.beginPath();
    c_bloom2.arc(CX, CY, ringR + R * 0.020, a0, a1);
    c_bloom2.stroke();
  }
}

// Bloom emit for the cardinal triangles — wider, lower-alpha re-paint.
// Gated by the triangles boot stage.
function emitBloomTriangles(t) {
  const boot = bootProgress(t, 'triangles');
  if (boot <= 0) return;
  const tipR  = R * 0.78;
  const baseR = R * 0.85;
  const halfBase = R * 0.046 * boot; // wider for bloom, scales with boot
  const pulse = (0.85 + 0.15 * Math.sin(t * 0.7)) * boot;
  for (const deg of [90, 270]) {
    const a = deg * DEG;
    const tipX = CX + Math.cos(a) * tipR;
    const tipY = CY + Math.sin(a) * tipR;
    const perpA = a + Math.PI / 2;
    const baseLX = CX + Math.cos(a) * baseR + Math.cos(perpA) * halfBase;
    const baseLY = CY + Math.sin(a) * baseR + Math.sin(perpA) * halfBase;
    const baseRX = CX + Math.cos(a) * baseR - Math.cos(perpA) * halfBase;
    const baseRY = CY + Math.sin(a) * baseR - Math.sin(perpA) * halfBase;
    c_bloom.fillStyle = 'rgba(240, 248, 255, ' + (0.65 * pulse).toFixed(3) + ')';
    c_bloom.beginPath();
    c_bloom.moveTo(tipX, tipY);
    c_bloom.lineTo(baseLX, baseLY);
    c_bloom.lineTo(baseRX, baseRY);
    c_bloom.closePath();
    c_bloom.fill();
    c_bloom2.fillStyle = 'rgba(180, 220, 255, ' + (0.50 * pulse).toFixed(3) + ')';
    c_bloom2.beginPath();
    c_bloom2.arc(tipX, tipY, R * 0.045, 0, TAU);
    c_bloom2.fill();
  }
}

// Bloom emit for the C-arc edges — only the bright thin edges, NOT the gray fill.
// Gated by the C-arcs boot stage.
function emitBloomCArcs(t) {
  const boot = bootProgress(t, 'cArcs');
  if (boot <= 0) return;
  const ringR = R * 0.55;
  const ringW = R * 0.110;
  const arcSpanDeg = 70;
  const rot = inertia(t, 0.014, { amp: 0.04, freq: 0.18 });
  const arcMidpoints = [45, 135, 225, 315];
  for (const midDeg of arcMidpoints) {
    const halfSpan = (arcSpanDeg / 2) * boot;
    const a0 = (midDeg - halfSpan) * DEG + rot;
    const a1 = (midDeg + halfSpan) * DEG + rot;
    c_bloom.strokeStyle = 'rgba(245, 250, 255, ' + (0.55 * boot).toFixed(3) + ')';
    c_bloom.lineWidth = 2.2;
    c_bloom.beginPath();
    c_bloom.arc(CX, CY, ringR + ringW * 0.5, a0, a1);
    c_bloom.stroke();
    c_bloom.beginPath();
    c_bloom.arc(CX, CY, ringR - ringW * 0.5, a0, a1);
    c_bloom.stroke();
    // Wider envelope on bloom2 around the whole arc band
    c_bloom2.strokeStyle = 'rgba(180, 220, 255, ' + (0.32 * boot).toFixed(3) + ')';
    c_bloom2.lineWidth = R * 0.028;
    c_bloom2.beginPath();
    c_bloom2.arc(CX, CY, ringR, a0, a1);
    c_bloom2.stroke();
  }
}

// Bloom emit for the inner double thin rings — circle stroke wider+softer.
// Gated by inner-rings boot stage; sweeps clockwise from 12 o'clock alongside the rings.
function emitBloomInnerRings(t) {
  const boot = bootProgress(t, 'innerRings');
  if (boot <= 0) return;
  const r1 = R * 0.30;
  const r2 = R * 0.21;
  const sweepStart = -Math.PI / 2;
  const sweepEnd   = sweepStart + TAU * boot;
  c_bloom.strokeStyle = 'rgba(245, 250, 255, ' + (0.55 * boot).toFixed(3) + ')';
  c_bloom.lineWidth = 2.0;
  c_bloom.beginPath(); c_bloom.arc(CX, CY, r1, sweepStart, sweepEnd); c_bloom.stroke();
  c_bloom.beginPath(); c_bloom.arc(CX, CY, r2, sweepStart, sweepEnd); c_bloom.stroke();
  // Soft halo at the very centre — gives the "core breathing" cinematic feel.
  // Comes online only when the inner rings have at least half-revealed.
  if (boot < 0.5) return;
  const haloAmt = (boot - 0.5) * 2;        // 0 → 1 over the second half of the inner-rings stage
  const corePulse = (0.55 + 0.30 * Math.sin(t * 1.1)) * haloAmt;
  const grad = c_bloom2.createRadialGradient(CX, CY, R * 0.02, CX, CY, R * 0.30);
  grad.addColorStop(0, 'rgba(220, 240, 255, ' + (0.35 * corePulse).toFixed(3) + ')');
  grad.addColorStop(0.6, 'rgba(180, 220, 255, ' + (0.18 * corePulse).toFixed(3) + ')');
  grad.addColorStop(1, 'rgba(80, 160, 220, 0)');
  c_bloom2.fillStyle = grad;
  c_bloom2.beginPath(); c_bloom2.arc(CX, CY, R * 0.30, 0, TAU); c_bloom2.fill();
}

// ═══ ANAMORPHIC LENS FLARE — horizontal cyan-white streak across centre ═══
// A thin band that pulses with a slow breathing envelope. Composited via
// mix-blend-mode: screen so it adds light without darkening anywhere.
// Comes online once the inner rings have started revealing (boot ≥ 0.95 s).
function drawAnamorphicFlare(t) {
  const innerRingsBoot = bootProgress(t, 'innerRings');
  if (innerRingsBoot <= 0) return;
  const breathe = (0.65 + 0.30 * Math.sin(t * 0.5)) * innerRingsBoot;
  const flareH = R * 0.020;
  const grad = c_flare.createLinearGradient(0, CY - flareH, 0, CY + flareH);
  grad.addColorStop(0,    'rgba(200, 240, 255, 0)');
  grad.addColorStop(0.5,  'rgba(220, 245, 255, ' + (0.72 * breathe).toFixed(3) + ')');
  grad.addColorStop(1,    'rgba(200, 240, 255, 0)');
  c_flare.fillStyle = grad;
  c_flare.fillRect(0, CY - flareH, W, 2 * flareH);
  // Bright pinpoint at the very centre — the flare's "hot spot"
  const cgrad = c_flare.createRadialGradient(CX, CY, 0, CX, CY, R * 0.18);
  cgrad.addColorStop(0,   'rgba(245, 252, 255, ' + (0.55 * breathe).toFixed(3) + ')');
  cgrad.addColorStop(0.4, 'rgba(160, 220, 255, ' + (0.22 * breathe).toFixed(3) + ')');
  cgrad.addColorStop(1,   'rgba(60, 140, 200, 0)');
  c_flare.fillStyle = cgrad;
  c_flare.beginPath(); c_flare.arc(CX, CY, R * 0.18, 0, TAU); c_flare.fill();
}

// ═══ SCANNER SWEEP — Iron-Man-style radial sweep around the reactor ═══
// A thin radial line that rotates around the centre at one revolution every
// 5 seconds, with a trailing ~60° wedge that fades from bright to invisible.
// Comes online once the inner rings have started revealing (boot ≥ 0.95 s),
// matching the moment the reactor "wakes up" in the boot sequence.
const SCANNER_PERIOD = 5.0;          // seconds per full revolution
const SCANNER_TRAIL_DEG = 60;        // trailing wedge sweep angle
function drawScannerSweep(t) {
  const innerRingsBoot = bootProgress(t, 'innerRings');
  if (innerRingsBoot <= 0) return;
  // Sweep angle — start at 12 o'clock (-π/2 in canvas Y-down), rotate clockwise
  const sweepAngle = -Math.PI / 2 + (t / SCANNER_PERIOD) * TAU;
  // Sweep radii — span the full reactor from inner-thin-ring out to tick scale
  const rIn  = R * 0.21;
  const rOut = R * 0.96;

  // (a) Trailing wedge — conic gradient using SAVE/CLIP + radial fan
  // We approximate via N short slices, each with decreasing alpha based on
  // how far back from the leading edge it is.
  const slices = 18;
  const sliceArc = (SCANNER_TRAIL_DEG * DEG) / slices;
  for (let i = 0; i < slices; i++) {
    const a0 = sweepAngle - (i + 1) * sliceArc;
    const a1 = sweepAngle - i * sliceArc;
    const fade = Math.pow(1 - i / slices, 2.2);   // quadratic falloff
    const alpha = 0.32 * fade * innerRingsBoot;
    if (alpha < 0.01) continue;
    c_scanner.beginPath();
    c_scanner.moveTo(CX, CY);
    c_scanner.arc(CX, CY, rOut, a0, a1);
    c_scanner.closePath();
    // Use a radial gradient inside the wedge to fade out toward the centre too
    const grad = c_scanner.createRadialGradient(CX, CY, rIn * 0.4, CX, CY, rOut);
    grad.addColorStop(0,    'rgba(220, 245, 255, 0)');
    grad.addColorStop(0.25, 'rgba(220, 245, 255, ' + (alpha * 0.4).toFixed(3) + ')');
    grad.addColorStop(0.85, 'rgba(160, 220, 255, ' + (alpha * 0.85).toFixed(3) + ')');
    grad.addColorStop(1,    'rgba(140, 210, 255, ' + alpha.toFixed(3) + ')');
    c_scanner.fillStyle = grad;
    c_scanner.fill();
  }

  // (b) Bright leading edge — thin radial line
  const leadAlpha = 0.78 * innerRingsBoot;
  c_scanner.strokeStyle = 'rgba(220, 245, 255, ' + leadAlpha.toFixed(3) + ')';
  c_scanner.lineWidth = 1.6;
  c_scanner.beginPath();
  c_scanner.moveTo(CX + Math.cos(sweepAngle) * rIn, CY + Math.sin(sweepAngle) * rIn);
  c_scanner.lineTo(CX + Math.cos(sweepAngle) * rOut, CY + Math.sin(sweepAngle) * rOut);
  c_scanner.stroke();

  // (c) Bright pinpoint on the leading edge where it crosses the outer tick scale
  const pinR = R * 0.96;
  c_scanner.fillStyle = 'rgba(245, 252, 255, ' + (0.92 * innerRingsBoot).toFixed(3) + ')';
  c_scanner.beginPath();
  c_scanner.arc(CX + Math.cos(sweepAngle) * pinR, CY + Math.sin(sweepAngle) * pinR, R * 0.0085, 0, TAU);
  c_scanner.fill();
}

// ═══ CHROMATIC ABERRATION — subtle RGB-shift on bright elements ═══
// Paints two thin offset rings (red shifted left, blue shifted right) on the
// brightest concentric circles. Adds cinematic-camera feel without breaking
// the silhouette (composited via screen, so additive only).
// Held off until the boot sequence reaches the readouts stage so it doesn't
// distract during the layer-by-layer reveal.
function drawChromaticAberration(t) {
  const boot = bootProgress(t, 'readouts');
  if (boot <= 0) return;
  const offset = 1.2 + 0.4 * Math.sin(t * 0.4);
  const r1 = R * 0.30;
  const r2 = R * 0.96;
  c_chroma.lineWidth = 0.9;
  // Red channel — shift left
  c_chroma.strokeStyle = 'rgba(255, 80, 90, ' + (0.45 * boot).toFixed(3) + ')';
  c_chroma.beginPath(); c_chroma.arc(CX - offset, CY, r1, 0, TAU); c_chroma.stroke();
  c_chroma.beginPath(); c_chroma.arc(CX - offset, CY, r2, 0, TAU); c_chroma.stroke();
  // Blue channel — shift right
  c_chroma.strokeStyle = 'rgba(100, 160, 255, ' + (0.45 * boot).toFixed(3) + ')';
  c_chroma.beginPath(); c_chroma.arc(CX + offset, CY, r1, 0, TAU); c_chroma.stroke();
  c_chroma.beginPath(); c_chroma.arc(CX + offset, CY, r2, 0, TAU); c_chroma.stroke();
}

// ═══ MAIN LOOP ═══
const T0 = performance.now() / 1000;
let grainCooldown = 0;

function frame() {
  const t = performance.now() / 1000 - T0;
  c_main.clearRect(0, 0, W, H);
  c_scanner.clearRect(0, 0, W, H);
  c_bloom.clearRect(0, 0, W, H);
  c_bloom2.clearRect(0, 0, W, H);
  c_flare.clearRect(0, 0, W, H);
  c_chroma.clearRect(0, 0, W, H);

  // Back-to-front (matches reference layering — silhouette identical to V-iter0)
  drawOuterTickScale(t);
  drawCardinalTriangles(t);
  drawCShapeMidRing(t);
  drawInnerThinRings(t);
  drawReadouts(t);

  // Iron-Man-style scanner sweep (Iter 3) — paints to its own canvas
  drawScannerSweep(t);

  // Marvel-grade cinematic post-processing (ADDITIVE only — composited over
  // the precision dial via mix-blend-mode: screen, so silhouette unchanged)
  emitBloomTickScale(t);
  emitBloomTriangles(t);
  emitBloomCArcs(t);
  emitBloomInnerRings(t);
  drawAnamorphicFlare(t);
  drawChromaticAberration(t);

  grainCooldown--;
  if (grainCooldown <= 0) { drawGrain(); grainCooldown = 4; }

  requestAnimationFrame(frame);
}

// Boot fade-in (cinematic entry)
window.addEventListener('load', () => {
  requestAnimationFrame(() => document.body.classList.add('booted'));
});

resize();
requestAnimationFrame(frame);
</script>
</body>
