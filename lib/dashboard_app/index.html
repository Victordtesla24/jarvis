<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JARVIS 3.0 — J.A.R.V.I.S. Protocol</title>
    <meta name="description" content="JARVIS holographic arc-reactor HUD — a three.js dashboard with live gauges polling /api/stats." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
      /* Plain-browser preview degrades to a dim holographic void; in the
         Electron overlay, preload adds body.in-app which forces this fully
         transparent so the desktop shows through (see styles/jarvis-hud.css). */
      html, body {
        background: transparent;
        background-color: #02060a;
        overflow: hidden;
        margin: 0;
      }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: rgba(0, 47, 167, 0.1); }
      ::-webkit-scrollbar-thumb { background: #00F0FF; }
      .scanlines {
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0,0,0,0.2) 50%,
          rgba(0,0,0,0.2)
        );
        background-size: 100% 4px;
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        pointer-events: none;
        z-index: 10;
      }
      .vignette {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        box-shadow: 0 0 150px rgba(0,0,0,0.9) inset;
        pointer-events: none;
        z-index: 5;
      }
    </style>
