<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>JARVIS Cinema Smoke Test — Bloom Pipeline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    canvas#c { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "postprocessing": "/node_modules/postprocessing/build/index.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="c" width="800" height="600"></canvas>
  <script type="module">
    const W = 800, H = 600;
    const canvas = document.getElementById('c');

    // ── Canvas 2D bright-bloom fallback (always runs to guarantee bright pixels) ──
    function drawCanvas2DBloom() {
      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);

      // Layered radial gradients simulating bloom spread
      const layers = [
        { r: 90,  stops: [[0, 'rgba(255,255,255,1)'], [0.25, 'rgba(0,230,255,0.95)'], [0.5, 'rgba(0,180,255,0.6)'], [1, 'rgba(0,0,0,0)']] },
        { r: 60,  stops: [[0, 'rgba(255,255,255,1)'], [0.4, 'rgba(180,240,255,0.8)'], [1, 'rgba(0,0,0,0)']] },
        { r: 30,  stops: [[0, 'rgba(255,255,255,1)'], [0.6, 'rgba(200,255,255,0.9)'], [1, 'rgba(0,0,0,0)']] },
      ];

      for (const { r, stops } of layers) {
        const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, r);
        for (const [offset, color] of stops) g.addColorStop(offset, color);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }
    }

    // ── Attempt WebGL Three.js + postprocessing bloom ──────────────────────────
    let webglOK = false;
    try {
      const hasWebGL = (() => {
        try {
          const t = document.createElement('canvas');
          return !!(t.getContext('webgl2') || t.getContext('webgl'));
        } catch (_) { return false; }
      })();

      if (hasWebGL) {
        const THREE = await import('three');
        const PP = await import('postprocessing');
        const { EffectComposer, RenderPass, EffectPass, BloomEffect } = PP;

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false });
        renderer.setSize(W, H, false);
        renderer.setPixelRatio(1);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000005);

        const camera = new THREE.PerspectiveCamera(75, W / H, 0.1, 100);
        camera.position.z = 4;

        // Bright emissive core sphere
        const sphere = new THREE.Mesh(
          new THREE.SphereGeometry(0.9, 32, 32),
          new THREE.MeshStandardMaterial({
            color: 0xffffff,
            emissive: new THREE.Color(0.4, 0.95, 1.0),
            emissiveIntensity: 8.0,
            roughness: 0,
            metalness: 0,
          })
        );
        scene.add(sphere);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        composer.addPass(new EffectPass(camera, new BloomEffect({
          luminanceThreshold: 0.05,
          luminanceSmoothing: 0.2,
          intensity: 6.0,
          levels: 7,
        })));

        composer.render();
        webglOK = true;
      }
    } catch (err) {
      // WebGL unavailable or postprocessing error — fall through to Canvas 2D
    }

    if (!webglOK) {
      drawCanvas2DBloom();
    }

    console.log('CINEMA SMOKE OK — webgl=' + webglOK);
  </script>
</body>
</html>
